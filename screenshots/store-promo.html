<!doctype html>
<!--
  Static composition for marketing screenshots (Chrome Web Store, readme).
  Page: https://www.aph.gov.au/ — captures aph-gov-au-*.png in this folder.
  Open at 100% zoom; capture each block at 1280×800.
  For headless export: http://…/store-promo.html?shot=main (Ackless popup)
  or ?shot=acknowledgement (welcome modal only). Use --window-size=1280,800.
  - #store-shot-acknowledgement: full-page welcome modal (before Continue)
  - #store-shot: same site after modal, with Ackless popup
-->
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Ackless — screenshot composition</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #1e293b;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 40px;
        padding: 24px 24px 48px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #store-shot,
      #store-shot-acknowledgement {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        border-radius: 12px;
        box-shadow:
          0 24px 80px rgb(0 0 0 / 45%),
          0 0 0 1px rgb(255 255 255 / 8%);
        background: #f1f5f9;
        display: flex;
        flex-direction: column;
        color: #0f172a;
      }

      .chrome-top {
        flex: 0 0 auto;
        height: 52px;
        background: linear-gradient(180deg, #e8eaef 0%, #dfe3ea 100%);
        border-bottom: 1px solid #c5ccd8;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 12px;
      }

      .traffic {
        display: flex;
        gap: 7px;
      }

      .traffic span {
        width: 11px;
        height: 11px;
        border-radius: 999px;
      }

      .traffic span:nth-child(1) {
        background: #ff5f57;
        box-shadow: inset 0 -1px 0 rgb(0 0 0 / 15%);
      }

      .traffic span:nth-child(2) {
        background: #febc2e;
        box-shadow: inset 0 -1px 0 rgb(0 0 0 / 12%);
      }

      .traffic span:nth-child(3) {
        background: #28c840;
        box-shadow: inset 0 -1px 0 rgb(0 0 0 / 12%);
      }

      .omnibox {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        margin-left: 8px;
        padding: 0 12px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #c9d1dc;
        box-shadow: inset 0 1px 2px rgb(15 23 42 / 6%);
        font-size: 13px;
        color: #475569;
      }

      .omnibox-icon {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        opacity: 0.85;
      }

      .page-wrap {
        flex: 1;
        position: relative;
        display: flex;
        background: #0f172a;
      }

      .page-screenshot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }

      .popup-panel {
        position: absolute;
        top: 18px;
        right: 22px;
        width: 286px;
        padding: 16px;
        border-radius: 14px;
        background: #fff;
        color: #0f172a;
        border: 1px solid rgb(15 23 42 / 12%);
        box-shadow:
          0 18px 50px rgb(15 23 42 / 18%),
          0 2px 8px rgb(15 23 42 / 8%);
      }

      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
      }

      .popup-panel h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .popup-panel > p.desc {
        margin: 0 0 14px;
        color: rgb(15 23 42 / 78%);
        font-size: 13px;
        line-height: 1.4;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: default;
        font-size: 14px;
        font-weight: 600;
        padding: 0;
      }

      .toggle__track {
        position: relative;
        display: inline-flex;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
        align-items: center;
        border-radius: 999px;
        background: #2563eb;
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 20%),
          0 0 0 1px rgb(37 99 235 / 35%);
      }

      .toggle__thumb {
        position: absolute;
        left: 21px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 1px 3px rgb(15 23 42 / 30%);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      .stats {
        padding: 12px;
        border: 1px solid rgb(15 23 42 / 14%);
        border-radius: 10px;
        background: rgb(15 23 42 / 5%);
      }

      .stats__value {
        display: block;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        line-height: 1;
      }

      .stats__label {
        display: block;
        margin-top: 5px;
        color: rgb(15 23 42 / 70%);
        font-size: 12px;
      }

      .host-button {
        width: 100%;
        margin-top: 12px;
        padding: 9px 10px;
        border: 1px solid rgb(15 23 42 / 18%);
        border-radius: 10px;
        background: rgb(15 23 42 / 7%);
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
      }

      .hint {
        margin-top: 14px;
        margin-bottom: 0;
        font-size: 12px;
        color: rgb(15 23 42 / 72%);
      }
    </style>
  </head>
  <body>
    <div id="store-shot-acknowledgement" aria-hidden="true">
      <div class="chrome-top">
        <div class="traffic" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="omnibox">
          <img
            class="omnibox-icon"
            src="../icons/icon-48.png"
            alt=""
            width="16"
            height="16"
          />
          <span>www.aph.gov.au</span>
        </div>
      </div>
      <div class="page-wrap">
        <img
          class="page-screenshot"
          src="aph-gov-au-with-dialog.png"
          alt=""
          width="1280"
          height="748"
        />
      </div>
    </div>

    <div id="store-shot" aria-hidden="true">
      <div class="chrome-top">
        <div class="traffic" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="omnibox">
          <img
            class="omnibox-icon"
            src="../icons/icon-48.png"
            alt=""
            width="16"
            height="16"
          />
          <span>www.aph.gov.au</span>
        </div>
      </div>
      <div class="page-wrap">
        <img
          class="page-screenshot"
          src="aph-gov-au-no-dialog.png"
          alt=""
          width="1280"
          height="748"
        />

        <aside class="popup-panel">
          <header class="popup-header">
            <h2>Ackless</h2>
            <div class="toggle" role="presentation">
              <span class="toggle__track" aria-hidden="true">
                <span class="toggle__thumb"></span>
              </span>
              <span>On</span>
            </div>
          </header>
          <p class="desc">
            Hide common Australian Welcome to Country and Acknowledgement of
            Country blocks.
          </p>
          <section class="stats-grid">
            <div class="stats">
              <span class="stats__value">2</span>
              <span class="stats__label">Hidden on this page</span>
            </div>
            <div class="stats">
              <span class="stats__value">47</span>
              <span class="stats__label">Hidden total</span>
            </div>
          </section>
          <button type="button" class="host-button">Enable on this site</button>
          <p class="hint">
            Refresh the current page after changing this setting.
          </p>
        </aside>
      </div>
    </div>
    <script>
      (function () {
        var shot = new URLSearchParams(location.search).get("shot");
        if (shot === "main") {
          document.getElementById("store-shot-acknowledgement")?.remove();
          document.body.style.paddingTop = "0";
          document.body.style.paddingBottom = "0";
        } else if (shot === "acknowledgement") {
          document.getElementById("store-shot")?.remove();
          document.body.style.paddingTop = "0";
          document.body.style.paddingBottom = "0";
        }
      })();
    </script>
  </body>
</html>
