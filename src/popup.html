<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ackless</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="popup-header">
        <h1>Ackless</h1>

        <button
          class="toggle"
          id="enabled"
          type="button"
          role="switch"
          aria-checked="true"
        >
          <span class="toggle__track" aria-hidden="true">
            <span class="toggle__thumb"></span>
          </span>
          <span class="toggle__state">On</span>
        </button>
      </header>

      <p>
        Hide common Australian Welcome to Country and Acknowledgement of Country
        blocks.
      </p>

      <button class="activity-button" id="view-activity" type="button">
        <span class="activity-button__label">View activity</span>
        <span class="activity-button__summary" id="activity-summary"
          >Last 24 hours across all sites</span
        >
      </button>

      <button class="host-button" id="add-current-site" type="button">
        Enable on this site
      </button>

      <p class="status" id="status" role="status"></p>

      <p class="hint">Refresh the current page after changing this setting.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
